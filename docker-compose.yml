version: '3.8'

services:
  mariadb:
    image: mariadb:lts-noble
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MARIADB_ROOT_HOST: '%'
    volumes:
      - ./db_data:/var/lib/mysql
    expose:
      - 3306
    restart: always

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234
      PMA_ABSOLUTE_URI: http://localhost:9000/phpmyadmin/
    depends_on:
      - mariadb
    ports:
      - "8080:80"

  node-app:
    build: .  # แก้ตรงนี้: ถ้า Dockerfile ของ Node อยู่โฟลเดอร์เดียวกับ docker-compose ให้ใช้ .
    container_name: node-app
    environment:
      DB_HOST: mariadb
      DB_USER: root
      DB_PASSWORD: 1234
      DB_NAME: test
      PORT: 3000
    depends_on:
      - mariadb
    ports:
      - "3000:3000"

  react-app:
    image: nginx:alpine
    container_name: react-app
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./react_nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"

  reverse_proxy:
    image: nginx:alpine
    container_name: reverse_proxy
    volumes:
      - ./proxy_params.conf:/etc/nginx/proxy_params
      - ./nginx_default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "9000:9000"
    depends_on:
      - node-app
      - react-app
      - phpmyadmin

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log