server {
    listen 9000;
    server_name localhost;

    location / {
        proxy_pass http://react-app/;
        include /etc/nginx/proxy_params;
    }

    location /api {
        proxy_pass http://node-app:3000;
        include /etc/nginx/proxy_params;
    }

    location /phpmyadmin {
        proxy_pass http://phpmyadmin/;
        include /etc/nginx/proxy_params;
    }
}